<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChimieMaster - Équilibre les Réactions</title>
    <style>
      body {
        background-color: #f3f4f6;
      }
      .molecule-bounce {
        animation: bounce-slight 2s infinite ease-in-out;
      }
      @keyframes bounce-slight {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }
      @keyframes pop-in {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes fade-out {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.5); opacity: 0; }
      }
      @keyframes attention {
        0%, 100% { transform: scale(1); border-color: #fee2e2; background-color: white; }
        50% { transform: scale(1.05); border-color: #f87171; background-color: #fef2f2; }
      }
      @keyframes confetti-explode {
        0% { transform: translate(0, 0) rotate(0deg) scale(0); opacity: 1; }
        50% { opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1); opacity: 0; }
      }
      @keyframes atom-vibrate {
        0% { transform: translate(0, 0) scale(1); }
        15% { transform: translate(-3px, 2px) scale(1.1); }
        30% { transform: translate(3px, -2px) scale(1.1); }
        45% { transform: translate(-3px, -2px) scale(1.2) rotate(-5deg); filter: brightness(1.3) drop-shadow(0 0 4px white); }
        60% { transform: translate(3px, 2px) scale(1.2) rotate(5deg); filter: brightness(1.3) drop-shadow(0 0 4px white); }
        75% { transform: translate(-2px, 0) scale(1.1); }
        100% { transform: translate(0, 0) scale(1); }
      }
      .particle {
        position: absolute;
        animation: confetti-explode var(--dur) ease-out forwards;
        animation-delay: var(--delay);
      }
    </style>
